{% if rows %}
<c-owner-table :rows="rows" :header="header" :url_name="url_name" />
{% else %}
{% include 'core/paper_no_records.html' %}
{% endif %}

{% if closed_rows %}
<div x-data="{ shown: false }">
    <nav class="filter-line">
        <button type="button" class="filter-line__item" @click="shown = ! shown" :aria-current="shown ? 'true' : null">{{ label }}</button>
    </nav>
    <c-owner-table :rows="closed_rows" closed :header="header" :url_name="url_name" x-show="shown" x-cloak />
</div>
{% endif %}
