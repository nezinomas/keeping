<c-vars title="" title_control="" subtitle="" hint="" table="" />

<section class="panel{% if table %} panel--table{% endif %}" {{ attrs }}>
    <h2 class="panel__title">{{ title }}{{ title_control }}{% if hint %} <c-tip class="panel__hint hint" side="right" text="{{ hint }}" label="{{ hint }}"><i class="bi bi-question-circle"></i></c-tip>{% endif %}</h2>
    {% if subtitle %}<p class="panel__subtitle">{{ subtitle }}</p>{% endif %}
    {{ slot }}
</section>
