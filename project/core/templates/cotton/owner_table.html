{% load i18n %}
<c-vars rows="" closed="" header="" url_name="" />

<c-paper-table :attrs="attrs">
    <c-slot name="head">
        <tr>
            <th class="text-left main__name">{{ header }}</th>
            <th class="edit-col"></th>
        </tr>
    </c-slot>
    {% for row in rows %}
    {% url url_name row.pk as url_update %}
    <c-edit-row :url="url_update">
        <td class="text-left main__name">{% if closed %}<s>{{ row.title }}</s> <span class="main__closed">{% blocktranslate with year=row.closed %}closed {{ year }}{% endblocktranslate %}</span>{% else %}{{ row.title }}{% endif %}</td>
        <c-td-edit :url="url_update" />
    </c-edit-row>
    {% endfor %}
</c-paper-table>
