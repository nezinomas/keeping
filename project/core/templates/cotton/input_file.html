<c-vars field />
{% load i18n %}

<c-field-wrapper :field="field">
    {% if field.value %}
        <div class="input-group">
            <span class="input-group-text">{% translate "Currently" %}</span>

            <div class="form-control">
                <a href="{{ field.value.url }}">{{ field.value }}</a>
                {% if not field.field.required %}
                    <div class="form-check">
                        <input type="checkbox" name="{{ field.html_name }}-clear" id="{{ field.html_name }}-clear_id" class="form-check-input">
                        <label for="{{ field.html_name }}-clear_id" style="margin-bottom: 0;">
                            {% translate "Clear" %}
                        </label>
                    </div>
                {% endif %}
            </div>
        </div>
    {% endif %}

    <div class="file-input" x-data="{ name: '' }">
        <input type="file" name="{{ field.html_name }}" class="visually-hidden" id="{{ field.id_for_label }}" {% if field.field.required and not field.value %}required{% endif %} @change="name = $el.files.length ? $el.files[0].name : ''">
        <label for="{{ field.id_for_label }}" class="form-control{% if field.errors %} is-invalid{% endif %}">
            <span class="file-input__button">{% translate "Choose file" %}</span>
            <span class="file-input__name" data-empty="{% translate 'No file chosen' %}" x-text="name || $el.dataset.empty">{% translate "No file chosen" %}</span>
        </label>
    </div>
</c-field-wrapper>
