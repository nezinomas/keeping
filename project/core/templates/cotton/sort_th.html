<c-vars key="" active="" url="" target="" column="" />

<th{% if column == "total" %} class="month-table__total"{% endif %}>
    {% if key == active %}
    <span>{{ slot }}</span>
    {% else %}
    <a role="button" hx-get="{{ url }}{% if '?' in url %}&amp;{% else %}?{% endif %}order={{ key }}" hx-target="{{ target }}">{{ slot }}</a>
    {% endif %}
</th>
