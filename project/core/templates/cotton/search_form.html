{% load i18n %}
<c-vars search="" />

<form novalidate
    method="post"
    id="search-form"
    hx-get="{{ url }}"
    hx-target="{{ target }}"
    hx-swap:inherited="innerHTML"
    hx-indicator:inherited="#indicator"
    x-data="{ search_str: '{{ search|escapejs }}' }">

        <input type="search" name="search"
            id="id_search"
            class="form-control"
            placeholder="{% translate 'Search' %}..."
            aria-label="{% translate 'Search' %}"
            x-model="search_str">

        <button type="submit" class="button-secondary">{% translate 'Search' %}</button>
        <button type="button"
            class="button-secondary"
            hx-get="{{ reset_url }}"
            hx-target="{{ target }}"
            @click="search_str = '';">
            {% translate 'Reset' %}
        </button>
</form>
