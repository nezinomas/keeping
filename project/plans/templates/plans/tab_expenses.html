{% load i18n %}

<div class="stat-cards">
    <c-stat-cards :cards="cards" />
</div>

<c-panel table id="necessary-expense-plans" title="{% translate 'Necessary expenses' %}" hint="{% translate 'Expense types marked as necessary. Mark a type necessary in its form on the Expenses page.' %}">
    <c-plans-table :rows="expense_plans.necessary" :year="plan_year" />
</c-panel>

<c-panel table id="necessary-plans" title="{% translate 'Additional necessary expenses' %}">
    <c-plans-table :rows="necessary_plans" :year="plan_year" />
</c-panel>

<c-panel table id="everyday-expense-plans" title="{% translate 'Everyday expenses' %}">
    <c-plans-table :rows="expense_plans.everyday" :year="plan_year" />
</c-panel>
