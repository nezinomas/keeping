{% load i18n %}

{% with object_list=expense_plans %}
<c-panel id="expense-plans" title="{% translate 'Expenses' %}">
    <c-plans-table :year=request.user.year :items=object_list type='expense_type' update='plans:expense_update' delete='plans:expense_delete' />
</c-panel>
{% endwith %}

{% with object_list=necessary_plans view=necessary_view %}
<c-panel id="necessary-plans" title="{% translate 'Additional necessary expenses' %}">
    <c-plans-table :year=request.user.year :items=object_list type='title' expense_type update='plans:necessary_update' delete='plans:necessary_delete' />
</c-panel>
{% endwith %}
