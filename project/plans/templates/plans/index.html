{% extends 'base.html' %}

{% load static %}
{% load i18n %}


{% block title %}{{ page_title }}{% endblock title %}


{% block css %}<link rel="stylesheet" href="{% static 'css/paper.min.css' %}">{% endblock css %}


{% block content %}

<div class="paper-skin" x-data="{ tab: '{{ tab }}' }">

<h1 class="visually-hidden">{% translate 'Plans' %}</h1>

<c-subnav :tabs=tabs :active=tab />

<main id="tab_content" class="grid-one-col" role="tabpanel" :aria-labelledby="'tab-' + tab">
    {% include 'plans/includes/tab_reload.html' %}
    {{ content }}
</main>

<div class="quick-add">
    <div class="quick-add__bar">
        <button type="button" x-show="tab === 'expenses'" x-cloak class="quick-add__pill" hx-get="{% url 'plans:expense_new' %}" hx-target="#mainModal">
            {% translate 'Add expenses plan' %}
        </button>
        <button type="button" x-show="tab === 'expenses'" x-cloak class="quick-add__pill" hx-get="{% url 'plans:necessary_new' %}" hx-target="#mainModal">
            {% translate 'Add necessary plan' %}
        </button>
        <button type="button" x-show="tab === 'incomes'" x-cloak class="quick-add__pill" hx-get="{% url 'plans:income_new' %}" hx-target="#mainModal">
            {% translate 'Add incomes plan' %}
        </button>
        <button type="button" x-show="tab === 'savings'" x-cloak class="quick-add__pill" hx-get="{% url 'plans:saving_new' %}" hx-target="#mainModal">
            {% translate 'Add savings plan' %}
        </button>
        <button type="button" x-show="tab === 'day'" x-cloak class="quick-add__pill" hx-get="{% url 'plans:day_new' %}" hx-target="#mainModal">
            {% translate 'Add day plan' %}
        </button>
        <button type="button" class="quick-add__pill" hx-get="{% url 'plans:copy' %}" hx-target="#mainModal">
            {% translate 'Copy plans' %}
        </button>
    </div>
</div>

</div>

{% endblock content %}
