{% load i18n %}

<div class="stat-cards">
    <c-stat-cards :cards="cards" />
</div>

<c-panel table id="day-plans" title="{% translate 'Sum per day' %}">
    <c-plans-table :rows="day_plans" :year="plan_year" />
</c-panel>

{% for block in calculations %}
<c-panel table id="calculations-{{ block.key }}" title="{{ block.title }}">
    <c-calculations-table :rows="block.rows" />
</c-panel>
{% endfor %}
