<div class="month-table">
<table class="main striped hover calculations-table">
    <thead>
        <tr>
            <th></th>
            <c-quarter-band />
        </tr>
        <tr>
            <th></th>
            <c-month-headers />
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr{% if row.part %} class="calculations-table__part"{% endif %}>
            <td>{{ row.label }}{% if row.words %}<span class="calculations-table__words">{{ row.words }}</span>{% endif %}</td>
            {% for value, state in row.cells %}
            <c-month-figure :value="value" class="{% if state == 'over' %}plans-table__over{% endif %}" />
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
