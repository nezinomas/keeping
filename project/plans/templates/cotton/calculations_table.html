{% load math %}
{% load cell_format %}

<div class="plans-table">
<table class="main striped hover calculations-table">
    <thead>
        <tr>
            <th class="text-left title-col"></th>
            <c-month-headers />
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr{% if row.part %} class="calculations-table__part"{% endif %}>
            <td class="text-left">{{ row.label }}{% if row.words %}<span class="calculations-table__words">{{ row.words }}</span>{% endif %}</td>
            {% for value, state in row.cells %}
            <td class="{{value|css_class_if_none}}{% if state == 'over' %} plans-table__over{% endif %}">{{value|price|cellformat:"0,00"}}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
