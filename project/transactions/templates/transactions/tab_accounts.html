{% load i18n %}{% translate 'Account' as header %}

{% if object_list %}
<c-owner-table :rows="object_list" :header="header" url_name="accounts:update" />
{% else %}
{% include 'core/paper_no_records.html' %}
{% endif %}

{% if closed_accounts %}
<div x-data="{ shown: false }">
    <nav class="filter-line">
        <button type="button" class="filter-line__item" @click="shown = ! shown" :aria-current="shown ? 'true' : null">{% translate 'Closed accounts' %}</button>
    </nav>
    <c-owner-table :rows="closed_accounts" closed :header="header" url_name="accounts:update" x-show="shown" x-cloak />
</div>
{% endif %}
