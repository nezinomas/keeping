{% load i18n %}

{% if object_list %}
<c-accounts-table :accounts="object_list" />
{% else %}
{% include 'core/paper_no_records.html' %}
{% endif %}

{% if closed_accounts %}
<div x-data="{ shown: false }">
    <nav class="filter-line">
        <button type="button" class="filter-line__item" @click="shown = ! shown" :aria-current="shown ? 'true' : null">{% translate 'Closed accounts' %}</button>
    </nav>
    <c-accounts-table :accounts="closed_accounts" closed x-show="shown" x-cloak />
</div>
{% endif %}
