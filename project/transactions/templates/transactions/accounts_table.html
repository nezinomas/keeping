{% load i18n %}

<table class="main striped hover"{% if closed %} x-show="shown" x-cloak{% endif %}>
    <thead>
        <tr>
            <th class="text-left">{% translate 'Account' %}</th>
            <th class="edit-col"></th>
        </tr>
    </thead>
    <tbody>
        {% for account in accounts %}
        {% url 'accounts:update' account.pk as url_update %}
        <tr hx-get="{{ url_update }}" hx-trigger="dblclick" hx-target="#mainModal">
            <td class="text-left">{% if closed %}<s>{{ account.title }}</s> <span class="main__closed">{% blocktranslate with year=account.closed %}closed {{ year }}{% endblocktranslate %}</span>{% else %}{{ account.title }}{% endif %}</td>
            <c-td-edit :url="url_update" />
        </tr>
        {% endfor %}
    </tbody>
</table>
