<nav class="subnav">
    <div class="tabs" role="tablist"
         x-data="{
             move(step) {
                 const buttons = [...$el.querySelectorAll('[role=tab]')];
                 const at = buttons.indexOf(document.activeElement);
                 const next = buttons[(at + step + buttons.length) % buttons.length];
                 next.focus();
                 next.click();
             }
         }"
         @keydown.arrow-right.prevent="move(1)"
         @keydown.arrow-left.prevent="move(-1)">
        {% for count_tab, url in tabs %}
        <button
            id="tab-{{ count_tab.name }}"
            class="tab{% if tab == count_tab.name %} active{% endif %}"
            role="tab"
            aria-controls="tab_content"
            aria-selected="{% if tab == count_tab.name %}true{% else %}false{% endif %}"
            tabindex="{% if tab == count_tab.name %}0{% else %}-1{% endif %}"
            :class="{ active: tab === '{{ count_tab.name }}' }"
            :aria-selected="tab === '{{ count_tab.name }}'"
            :tabindex="tab === '{{ count_tab.name }}' ? 0 : -1"
            @click="tab = '{{ count_tab.name }}'"
            hx-get="{{ url }}"
            hx-push-url="true"
            hx-target="#tab_content"
            hx-indicator="#indicator">
            {{ count_tab.title }}
        </button>
        {% endfor %}
    </div>
</nav>
