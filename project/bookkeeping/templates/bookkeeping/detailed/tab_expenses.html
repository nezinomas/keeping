{% for table in tables %}
<c-panel table id="detailed-{{ table.url_title }}" title="{{ table.title }}" subtitle="{{ table.subtitle }}">
    <div class="month-table" id="{{ table.table_id }}">
        <c-detailed-table :title=table.title :order=table.order :data=table.data :total=table.total :months=months :url=table.url :table_id=table.table_id />
    </div>
</c-panel>
{% empty %}
{% include 'bookkeeping/detailed/notice.html' %}
{% endfor %}
