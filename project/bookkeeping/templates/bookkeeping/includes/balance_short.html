{% load get_item %}
{% load math %}
{% load i18n %}
{% load cell_format %}

<c-paper-table class="main striped hover" x-data="{ open:false }">
    <c-slot name="head">
        <tr>
            <th>
                <span class="tip right" data-tip="{% translate 'Forecast' %}">
                <a
                    role="button"
                    class="button-expand"
                    @click="open = ! open"
                    hx-get="{% url 'bookkeeping:forecast' %}"
                    hx-target="#last"
                    hx-swap="afterend"
                    hx-trigger="click once"
                    hx-indicator="#indicator"
                    >
                    <i class="bi" :class="open ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
                </a></span>
            </th>
            {% for title in data.title %}
            <th>{{ title }}</th>
            {% endfor %}
        </tr>
    </c-slot>
    <c-slot name="body">
    <tbody id="last">
        <tr>
            <td></td>
            {% for d in data.data %}
            <td class="main__figure"{% if d and data.highlight|get_list_val:forloop.counter0 %} data-sign="{{d|sign}}"{% endif %}>{{d|price|cellformat}}</td>
            {% endfor %}
        </tr>
    </tbody>
    </c-slot>
</c-paper-table>
