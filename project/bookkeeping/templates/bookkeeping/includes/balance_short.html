{% load get_item %}
{% load math %}
{% load cell_format %}

<c-paper-table class="main striped hover">
    <c-slot name="head">
        <tr>
            {% for th in title %}
            <th>{{ th }}</th>
            {% endfor %}
        </tr>
    </c-slot>
    <tr>
        {% for d in data %}
        <td class="main__figure"{% if d and highlight|get_list_val:forloop.counter0 %} data-sign="{{d|sign}}"{% endif %}>{{d|price|cellformat}}</td>
        {% endfor %}
    </tr>
</c-paper-table>
