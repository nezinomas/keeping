{% load cell_format %}
{% load math %}
{% load i18n %}

{% if data.title and data.data %}
<div class="kpi-card">
    <div class="kpi-title">{{ data.title.0 }}</div>
    <div class="kpi-value {{ data.data.0|positive_negative }}">{{ data.data.0|price|cellformat }}</div>
</div>

<div class="kpi-card">
    <div class="kpi-title">{{ data.title.1 }}</div>
    <div class="kpi-value {{ data.data.1|positive_negative }}">{{ data.data.1|price|cellformat }}</div>
</div>

<div class="kpi-card" x-data="{ open: false }">
    <div class="kpi-title">{% translate 'Forecast' %}</div>
    <div class="kpi-value" id="forecast-value">
        <button x-show="!open"
                class="button button-secondary button-sm"
                @click="open = true"
                hx-get="{% url 'bookkeeping:forecast' %}"
                hx-target="#forecast-value"
                hx-swap="innerHTML"
                hx-indicator="#indicator">
            {% translate 'Calculate' %}
        </button>
    </div>
</div>
{% endif %}
