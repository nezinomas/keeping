{% load get_item %}
{% load math %}
{% load cell_format %}

<tfoot x-show="open">
    <tr>
        <td></td>
        {% for row in data %}
        <td class="main__figure"{% if row and highlight|get_list_val:forloop.counter0 %} data-sign="{{row|sign}}"{% endif %}>{{row|price|cellformat}}</td>
        {% endfor %}
    </tr>
</tfoot>
