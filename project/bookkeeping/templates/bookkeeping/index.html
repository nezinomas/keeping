{% extends 'core/paper_page.html' %}

{% load static %}


{% block head_scripts %}
    {% include 'highcharts.html' %}
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_index_balance.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_index_expenses.js' %}"></script>
{% endblock head_scripts %}


{% block page_name %}{{ request.user.selected_year }}{% endblock page_name %}


{% block tab_listeners %}
<script nonce="{{ csp_nonce }}">
    onTabContent('chart-expenses-data', drawIndexExpenses);
    onTabContent('chart-balance-data', drawIndexBalance);
</script>
{% endblock tab_listeners %}
