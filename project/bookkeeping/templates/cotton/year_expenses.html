{% load i18n %}

<c-paper-table class="main striped hover">
    <c-slot name="head">
        <tr>
            <th>{{ year|title }}</th>
            {% for category in ctx.categories %}<th><c-tip side="bottom" text="{{ category }}" description="{{ category }}">{{ category|truncatechars:8 }}</c-tip></th>{% endfor %}
            <th>{% translate 'Total' %}</th>
        </tr>
    </c-slot>
    {% for item, total_column in ctx.data %}
    <tr>
        <td>{{ item.date|date:"F"|title }}</td>
        <c-expenses-by-type-row :row="item" :categories="ctx.categories" :total="total_column.total" />
    </tr>
    {% endfor %}
    <c-slot name="foot">
        <tr class="main__total">
            <td>{% translate 'Average' %}</td>
            <c-expenses-by-type-row :row="ctx.avg_row" :categories="ctx.categories" :total="ctx.avg" />
        </tr>
        <tr class="main__total">
            <td>{% translate 'Total' %}</td>
            <c-expenses-by-type-row :row="ctx.total_row" :categories="ctx.categories" :total="ctx.total" />
        </tr>
    </c-slot>
</c-paper-table>
