{% extends 'base.html' %}

{% load static %}


<!-- the paper skin's bundle, in place of the legacy one: a whole stylesheet, not
     an addition to it. The head block appends rather than replaces, so putting
     the link there would load both bundles and hand the argument over .main,
     #search-form and .pagination back to the cascade -->
{% block css %}<link rel="stylesheet" href="{% static 'css/paper.min.css' %}">{% endblock css %}


{% block head %}
    {% include 'highcharts.html' with bullet="True" %}
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_books_finished.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/sticky-table-headers.js' %}"></script>
{% endblock head %}


{% block content %}

<div class="paper-skin">

<main class="grid-one-col">
    <div class="stat-cards" hx-trigger="reload from:body, afterTarget from:body" hx-get="{% url 'books:cards' %}">{{ cards }}</div>

    <div hx-trigger="reloadSearch from:body"><c-search-form url="{% url 'books:search' %}" reset_url="{% url 'books:list' %}" target="#data" /></div>

    <div id="data" hx-trigger="reload from:body" hx-get="{% url 'books:list' %}{% if tab %}?tab={{tab}}{% endif %}" hx-indicator="#indicator">{{books}}</div>

    <div id="chart-finished-container"></div>
</main>

<div id="chart-finished-loader" hx-get="{% url 'books:chart_finished' %}" hx-trigger="load, reload from:body, afterTarget from:body"></div>

</div>

<script nonce="{{ csp_nonce }}">
    htmx.on('htmx:afterSwap', function (event) {
        if (event.detail.target.id === 'chart-finished-loader' && document.getElementById('chart-finished-data')) {
            chartFinished('chart-finished-data', 'chart-finished-container');
        }
    });
</script>

{% endblock content %}
