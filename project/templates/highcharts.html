{% load static %}

<script nonce="{{ csp_nonce }}" src="{% static 'highcharts/highcharts.js' %}"></script>
<script nonce="{{ csp_nonce }}" src="{% static 'highcharts/themes/theme.js' %}"></script>
<link rel="stylesheet" href="{% static 'highcharts/themes/theme.css' %}">


{% if bullet %}
    <script nonce="{{ csp_nonce }}" src="{% static 'highcharts/modules/bullet.js' %}"></script>
{% endif %}


{% if annotations %}
    <script nonce="{{ csp_nonce }}" src="{% static 'highcharts/modules/annotations.js' %}"></script>
{% endif %}


{% if heatmap %}
    <script nonce="{{ csp_nonce }}" src="{% static 'highcharts/modules/heatmap.js' %}"></script>
{% endif %}


{% if lollipop %}
    <script nonce="{{ csp_nonce }}" src="{% static 'highcharts/highcharts-more.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'highcharts/modules/dumbbell.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'highcharts/modules/lollipop.js' %}"></script>
{% endif %}
