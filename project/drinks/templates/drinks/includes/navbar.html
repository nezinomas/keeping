{% load i18n %}

<nav id="drinks-nav" data-tab="{{ tab }}">
    <button
        class="tab{% if tab == 'index' %} active{% endif %}"
        hx-get="{% url 'drinks:tab_index' %}"
        hx-target="#tab_content">
        {% translate 'Charts' %}
    </button>

    <button
        class="tab{% if tab == 'trends' %} active{% endif %}"
        hx-get="{% url 'drinks:tab_trends' %}"
        hx-target="#tab_content">
        {% translate 'Trends' %}
    </button>

    <button
        class="tab{% if tab == 'risk' %} active{% endif %}"
        hx-get="{% url 'drinks:tab_risk' %}"
        hx-target="#tab_content">
        {% translate 'Risk' %}
    </button>

    <button
        class="tab{% if tab == 'history' %} active{% endif %}"
        hx-get="{% url 'drinks:tab_history' %}"
        hx-target="#tab_content">
        {% translate 'History' %}
    </button>

    <button
        class="tab{% if tab == 'data' %} active{% endif %}"
        hx-get="{% url 'drinks:tab_data' %}"
        hx-target="#tab_content">
        {% translate 'Data' %}
    </button>

    <div>
        <div class="dropdown">
            <button class="dropdown__btn">{{current_drink_type}}</button>
            <div class="dropdown__menu">
                {% for type in select_drink_type %}
                <a class="dropdown-item button-sm" href="{% url 'drinks:set_drink_type' type.1 %}?tab={{ tab }}" hx-get="{% url 'drinks:set_drink_type' type.1 %}?tab={{ tab }}" hx-swap="none">{{type.0}}</a>
                {% endfor %}
            </div>
        </div>
    </div>
</nav>
