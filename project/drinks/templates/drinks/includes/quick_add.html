{% load i18n %}

<div id="quick-add" class="quick-add"
     x-data="{
         open: false,
         option: '{{ drink_types.selected|default:'beer' }}',
         quantity: '',
         defaults: { beer: '1', wine: '150', vodka: '40', stdav: '1' },
         steps: { beer: 1, wine: 50, vodka: 10, stdav: 1 },
         init() {
             this.updateQuantity();
         },
         updateQuantity() {
             this.quantity = this.defaults[this.option] || '1';
         }
     }"
     @keydown.window.escape="open = false">

    <div class="quick-add__sheet" x-show="open" x-cloak x-transition
         @click.outside="open = false">
        <form hx-post="{% url 'drinks:quick_add' %}"
              hx-swap="none"
              hx-on::after-request="if (event.detail.successful || (event.detail.xhr && event.detail.xhr.status < 400)) { Alpine.$data(this).open = false; Alpine.$data(this).updateQuantity(); }">
            {% csrf_token %}
            <input type="hidden" name="tab" id="quick-add-tab" value="index">

            <div class="select-wrapper quick-add__day">
                <select name="date" class="form-select">
                    {% for day in recent_days.options %}
                    <option value="{{ day.1 }}"{% if day.1 == recent_days.selected %} selected{% endif %}>{{ day.0 }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="select-wrapper quick-add__type">
                <select name="option" class="form-select"
                        x-model="option"
                        @change="updateQuantity()">
                    {% for type in drink_types.options %}
                    <option value="{{ type.1 }}" {% if type.1 == drink_types.selected %}selected{% endif %}>{{ type.0 }}</option>
                    {% endfor %}
                </select>
            </div>

            <input type="number" name="quantity" class="form-control quick-add__qty"
                   min="0" :step="steps[option]"
                   inputmode="decimal" autocomplete="off" required
                   placeholder="{% translate 'Quantity' %}"
                   x-model="quantity">

            <button type="submit" class="button-secondary">{% translate 'Add' %}</button>
            <button type="button" class="button-secondary"
                    @click.prevent="htmx.ajax('GET', '/drinks/' + document.getElementById('quick-add-tab').value + '/new/', '#mainModal')">
                {% translate 'More' %}...
            </button>
        </form>
    </div>

    <button type="button" class="quick-add__pill" @click="open = !open">
        {% translate 'Log a drink' %}
    </button>
</div>
