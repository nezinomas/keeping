{% for card in cards %}
<div class="trend-card">
    <div class="trend-card__label">{{ card.title }}</div>

    {% if card.blank %}
    <div class="trend-card__value">&mdash;</div>
    {% else %}
    <div class="trend-card__value {{ card.css_class }}">
        {{ card.arrow_glyph }}
        {{ card.value }}
        {% if card.explanation %}
        <span class="trend-card__info" tabindex="0" role="note" aria-label="{{ card.explanation }}">
            <i class="bi bi-info-circle" aria-hidden="true"></i>
            <span class="trend-card__explanation" role="tooltip">{{ card.explanation }}</span>
        </span>
        {% endif %}
    </div>
    {% endif %}

    <div class="trend-card__note">{{ card.note }}</div>
</div>
{% endfor %}
