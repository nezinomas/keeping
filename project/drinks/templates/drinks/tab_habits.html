{% load i18n %}
{% load static %}

{% include 'drinks/includes/drink_type.html' with oob=True %}

<main class="habits-grid">
    <div id="habits-summary" class="stat-cards">
        <c-stat-cards :cards=cards />
    </div>

    <div id="chart-weekday-container"></div>

    <!-- the chart fetches itself, so the range pooled and the legend naming it
         are always the same reading. On load it draws the header year alone -->
    <div id="typical-year">
        <div id="chart-typical-year-container" hx-get="{% url 'drinks:typical_year' %}" hx-trigger="load"></div>

        <div class="pool-controls">
            <button type="button" class="button-secondary" hx-get="{% url 'drinks:typical_year_all' %}" hx-target="#chart-typical-year-container">{% translate 'All years' %}</button>
            <button type="button" class="button-secondary" hx-get="{% url 'drinks:typical_year_last' 2 %}" hx-target="#chart-typical-year-container">{% translate '2 years' %}</button>
            <button type="button" class="button-secondary" hx-get="{% url 'drinks:typical_year_last' 3 %}" hx-target="#chart-typical-year-container">{% translate '3 years' %}</button>
            <button type="button" class="button-secondary" hx-get="{% url 'drinks:typical_year_last' 5 %}" hx-target="#chart-typical-year-container">{% translate '5 years' %}</button>

            <span class="controls-divider"></span>

            <!-- filled by the same response as the chart, swapped in out of
                 band, so the boxes open on the years actually plotted -->
            <div id="typical-year-form"></div>

            <!-- the same fetch the tab opens on: Clear puts the chart back to
                 the header year alone. Outside the form, since it asks for no range -->
            <button type="button" class="button-secondary" hx-get="{% url 'drinks:typical_year' %}" hx-target="#chart-typical-year-container">{% translate 'Clear' %}</button>
        </div>
    </div>
</main>

{{chart_weekday.as_dict|json_script:"chart-weekday-data"}}
