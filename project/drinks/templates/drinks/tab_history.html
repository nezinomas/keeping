{% load i18n %}

{% include 'drinks/includes/drink_type.html' with oob=True %}

{% if records %}

<main class="history-grid">
    <c-panel title="{% translate 'Drinks' %}">
        <div id="chart-summary-container"></div>
    </c-panel>

    <!-- Year comparison: one shared chart with presets + custom pick below it -->
    <c-panel id="historical-data" title="{% translate 'Year comparison' %}">
        <div id="chart-history-container" hx-get="{% url 'drinks:compare' 2 %}" hx-trigger="load"></div>

        <div class="compare-controls">
            <button type="button" class="button-secondary" hx-get="{% url 'drinks:compare' 2 %}" hx-target="#chart-history-container">{% translate '2 years' %}</button>
            <button type="button" class="button-secondary" hx-get="{% url 'drinks:compare' 3 %}" hx-target="#chart-history-container">{% translate '3 years' %}</button>
            <button type="button" class="button-secondary" hx-get="{% url 'drinks:compare' 7 %}" hx-target="#chart-history-container">{% translate '7 years' %}</button>

            <span class="controls-divider"></span>

            {% include 'drinks/includes/compare_form.html' %}
        </div>
    </c-panel>
</main>

{{chart|json_script:"chart-summary-data"}}

{% else %}

    {% include 'core/no_records.html' with two_years=True %}

{% endif %}
