{% extends 'base.html' %}

{% load static %}


{% block head %}
    {% include 'highcharts.html' with heatmap="True" %}
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_calendar.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_quantity.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_consumption.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_trend.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_cumulative.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_weekly.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_heavy_days.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_compare.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_summary.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/sticky-table-headers.js' %}"></script>
{% endblock head %}


{% block content %}


<!-- htmx tab data load -->
<div hx-get="{% url 'drinks:tab_index' %}" hx-target="#tab_content" hx-trigger="reloadIndex from:body"></div>
<div hx-get="{% url 'drinks:tab_trends' %}" hx-target="#tab_content" hx-trigger="reloadTrends from:body"></div>
<div hx-get="{% url 'drinks:tab_risk' %}" hx-target="#tab_content" hx-trigger="reloadRisk from:body"></div>
<div hx-get="{% url 'drinks:tab_data' %}" hx-target="#tab_content" hx-trigger="reloadData from:body"></div>
<div hx-get="{% url 'drinks:tab_history' %}" hx-target="#tab_content" hx-trigger="reloadHistory from:body"></div>

<!-- tab content -->
<div id="tab_content">
    {{content}}
</div>

{% include 'drinks/includes/quick_add.html' %}

<script nonce="{{ csp_nonce }}">
    function initDrinksCharts() {
        if (document.getElementById('chart-consumption-data')) {
            chartConsumption('chart-consumption-data', 'chart-consumption-container');
            chartQuantity('chart-quantity-data', 'chart-quantity-container');
            chartCalender('chart-calendar-1H-data', 'chart-calendar-1H-container');
            chartCalender('chart-calendar-2H-data', 'chart-calendar-2H-container');
        }
        if (document.getElementById('chart-summary-data')) {
            chart_drinks_summary("chart-summary-data", "chart-summary-container");
        }
        if (document.getElementById('chart-trend-data')) {
            chartTrend('chart-trend-data', 'chart-trend-container');
        }
        if (document.getElementById('chart-cumulative-data')) {
            chartDrinksCumulative('chart-cumulative-data', 'chart-cumulative-container');
        }
        if (document.getElementById('chart-weekly-data')) {
            chartDrinksWeekly('chart-weekly-data', 'chart-weekly-container');
        }
        if (document.getElementById('chart-heavy-data')) {
            chartDrinksHeavyDays('chart-heavy-data', 'chart-heavy-container');
        }
    }

    document.addEventListener('DOMContentLoaded', initDrinksCharts);

    htmx.on('htmx:afterSwap', function (event) {
        const targetId = event.detail.target.id;
        if (targetId === 'tab_content') {
            initDrinksCharts();
            const nav = document.querySelector('#drinks-nav');
            const tabInput = document.getElementById('quick-add-tab');
            if (nav && tabInput) { tabInput.value = nav.dataset.tab || 'index'; }
        }
        if (targetId === 'chart-history-container' && document.getElementById('chart-history-data')) {
            chartCompare('chart-history-data', 'chart-history-container');
        }
        if (targetId === 'compare-form-and-chart' && document.getElementById('chart-compare-two-data')) {
            chartCompare('chart-compare-two-data', 'chart-compare-two-container');
        }
        if (targetId === 'mainModal') {
            const input = document.getElementById('id_quantity');
            if (input) {
                input.type = 'text';
                input.addEventListener('keyup', function (e) {
                    e.preventDefault();
                    input.value = input.value.replace(/,/g, '.');
                });
            }
        }
    });
</script>

{% endblock content %}
