{% extends 'base.html' %}

{% load static %}


{% block head %}
    {% include 'highcharts.html' with heatmap="True" %}
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_calendar.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_quantity.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_consumption.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_compare.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/chart_drinks_summary.js' %}"></script>
    <script nonce="{{ csp_nonce }}" src="{% static 'js/sticky-table-headers.js' %}"></script>
{% endblock head %}


{% block content %}


<!-- htmx tab data load -->
<div hx-get="{% url 'drinks:tab_index' %}" hx-target="#tab_content" hx-trigger="reloadIndex from:body"></div>
<div hx-get="{% url 'drinks:tab_data' %}" hx-target="#tab_content" hx-trigger="reloadData from:body"></div>
<div hx-get="{% url 'drinks:tab_history' %}" hx-target="#tab_content" hx-trigger="reloadHistory from:body"></div>

<!-- tab content -->
<div id="tab_content">
    {{content}}
</div>

<script nonce="{{ csp_nonce }}">
    function initDrinksCharts() {
        if (document.getElementById('chart-consumption-container')) {
            chartConsumption('chart-consumption-data', 'chart-consumption-container');
            chartQuantity('chart-quantity-data', 'chart-quantity-container');
            chartCalender('chart-calendar-1H-data', 'chart-calendar-1H-container');
            chartCalender('chart-calendar-2H-data', 'chart-calendar-2H-container');
        }
    }

    document.addEventListener('DOMContentLoaded', initDrinksCharts);
    htmx.on('htmx:afterSwap', initDrinksCharts);
</script>

{% endblock content %}
