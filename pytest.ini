[pytest]
# where the django settings are
DJANGO_SETTINGS_MODULE = project.config.settings.testing

# project/conftest.py registers the Hypothesis profiles; it must load before --hypothesis-profile
testpaths = project

# output logging records into the console
log_cli = True

# do not create migrations
addopts = --reuse-db --nomigrations

#
markers =
	no_main_user: the test creates its own user, no main_user fixture
	webtest: integration tests
